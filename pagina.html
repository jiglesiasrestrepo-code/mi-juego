<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Aprende Redes Sociales</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      background: #1a1a1a;
      padding: 15px;
      text-align: center;
      font-size: 26px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #1f1f1f;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      background: #292929;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      margin-top: 10px;
      background: #ff0033;
      border: none;
      padding: 10px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #cc0029;
    }
  </style>
</head>
<body>

<header>
  📱 Aprende cómo funcionan las redes sociales
</header>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h2>El Influencer</h2>
    <p>Te enseña cómo crecer seguidores.</p>
    <button onclick="mostrar('influencer')">Aprender</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h2>El Programador</h2>
    <p>Explica cómo funcionan los algoritmos.</p>
    <button onclick="mostrar('programador')">Aprender</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h2>El Psicólogo</h2>
    <p>Te muestra por qué las redes son adictivas.</p>
    <button onclick="mostrar('psicologo')">Aprender</button>
  </div>

</div>

<script>
  function mostrar(tipo) {
    if (tipo === "influencer") {
      alert("📈 Publica contenido constante, usa tendencias y conecta con tu audiencia.");
    } 
    else if (tipo === "programador") {
      alert("🤖 Los algoritmos muestran contenido según lo que ves, das like y compartes.");
    } 
    else if (tipo === "psicologo") {
      alert("🧠 Las redes usan dopamina (likes, notificaciones) para mantenerte enganchado.");
    }
  }
</script>

</body>
</html>
